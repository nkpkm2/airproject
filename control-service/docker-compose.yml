services:
  mqtt:
    image: eclipse-mosquitto:2
    container_name: air-control-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt-data:/mosquitto/data
      - mqtt-log:/mosquitto/log

  control:
    build: .
    container_name: air-control-service
    restart: unless-stopped
    depends_on:
      - mqtt
    environment:
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
    ports:
      - "8780:8780"

volumes:
  mqtt-data:
  mqtt-log:
